name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Runner images can ship an Xcode whose iOS simulator runtime is not
      # installed, so pick the newest Xcode 26 that has an iPhone simulator.
      - name: Select Xcode 26 and an iPhone simulator
        run: |
          for xcode in $(find /Applications -maxdepth 1 -name 'Xcode_26*.app' \
              | grep -viE 'beta|release_candidate' | sort -rV); do
            sudo xcode-select -s "$xcode"
            udid=$(xcrun simctl list devices available -j \
              | jq -r '[.devices | to_entries[]
                  | select(.key | contains("iOS-26"))
                  | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
            if [ -n "$udid" ]; then
              echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
              xcodebuild -version
              echo "Simulator: $udid"
              exit 0
            fi
          done
          echo "::error::No Xcode 26 with an iOS 26 iPhone simulator found"
          exit 1

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('HatGame/HatGame.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Unit tests (iOS Simulator)
        run: |
          xcodebuild test \
            -project HatGame/HatGame.xcodeproj \
            -scheme HatGame \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:HatGameTests \
            -clonedSourcePackagesDirPath .spm

      - name: Build (macOS)
        run: |
          xcodebuild build \
            -project HatGame/HatGame.xcodeproj \
            -scheme HatGame \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO
