name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' \
            | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 found in /Applications"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('HatGame/HatGame.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Unit tests (iOS Simulator)
        run: |
          xcodebuild test \
            -project HatGame/HatGame.xcodeproj \
            -scheme HatGame \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:HatGameTests \
            -clonedSourcePackagesDirPath .spm

      - name: Build (macOS)
        run: |
          xcodebuild build \
            -project HatGame/HatGame.xcodeproj \
            -scheme HatGame \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO
